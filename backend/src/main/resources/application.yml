# Configuração da API. Atende o item 3 da Entrega 2 (back-end com o banco já migrado pelo Flyway).
#
# Três jeitos de rodar:
#   sem perfil  -> banco "portal", só as migrações de todos os ambientes (db/migration). É o jeito de produção.
#   perfil dev  -> banco "portal", migrações + a amostra de exemplo (db/dev). Uso diário de quem desenvolve.
#   perfil test -> banco "portal_teste", igual ao dev, e os testes o apagam e recriam a cada execução.
#
# Usuário, senha e endereço do banco vêm de variáveis de ambiente; o padrão serve para a máquina de desenvolvimento.
#
# [ATLAS] O modelo de linguagem do Atlas vem DESLIGADO (spring.ai.model.chat=none): o portal e a suíte sobem para todo mundo,
# sem chave, e a mensagem de texto do Atlas responde 503 (com atlas.relatorio.ligado, o botão "Montar relatório" é o plano B). Para ligar: ATLAS_LLM=openai e OPENCODE_API_KEY, e, se
# quiser, ATLAS_LLM_BASE_URL e ATLAS_LLM_MODELO. Chave em variável de ambiente ou, no perfil dev, em config/segredos.local.properties; nunca neste arquivo.

spring:
  application:
    name: planeta360-portal
  datasource:
    url: ${PORTAL_BD_URL:jdbc:postgresql://localhost:5432/portal}
    username: ${PORTAL_BD_USUARIO:portal}
    password: ${PORTAL_BD_SENHA:portal}
  flyway:
    # Sem perfil: nunca carrega a amostra (db/dev) em produção.
    locations: classpath:db/migration
  servlet:
    multipart:
      # [UPLOAD] [CARGA] Limite de 20 MB por arquivo (material da marca e planilhas CSV). Padrão do Spring é 1 MB.
      # A requisição ganha 1 MB de folga para os cabeçalhos do multipart: assim um arquivo de exatamente 20 MB chega
      # ao Armazenamento, que confere o limite exato (portal.armazenamento.tamanho-maximo-bytes) e responde 413.
      max-file-size: 20MB
      max-request-size: 21MB
  jackson:
    mapper:
      # Mantém a ordem dos campos como escrita nos records (id, nome, email...), sem ordenar por letra.
      sort-properties-alphabetically: false
  ai:
    model:
      # [ATLAS] none: não cria nenhum modelo, e o Atlas só oferece o botão (plano B). openai: liga o OpenCode Go (compatível com OpenAI).
      chat: ${ATLAS_LLM:none}
      # O portal só conversa; os outros modelos do starter da OpenAI nunca são criados, com ou sem chave.
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    openai:
      api-key: ${OPENCODE_API_KEY:}
      base-url: ${ATLAS_LLM_BASE_URL:https://opencode.ai/inference/go/openai/v1}
      # O Go pede um user agent próprio (PlanetaAtlas/0.1): quem o troca é o LlmConfig, porque custom-headers só acrescentaria um
      # segundo valor ao User-Agent que o Spring AI já manda. O cabeçalho x-opencode-session vai a cada chamada, com a conversa.
      # Poucas tentativas: o Go limita o uso a cada 5 horas e não vale gastar o limite repetindo.
      max-retries: 1
      timeout: 60s
      chat:
        model: ${ATLAS_LLM_MODELO:deepseek-v4.1-flash}
        temperature: 0.2
        # O thinking (raciocínio) não fica aqui: é o atlas.raciocinio, abaixo, que o provedor põe no topo do corpo a cada chamada.

# [ATLAS] Teto diário de mensagens do assistente por parceria (do dia de Brasília, só as do modelo de linguagem; o botão não conta).
# Com o teto atingido, a rota 44 com texto responde 429. Serve para uma rodada de testes não gastar o limite do provedor.
atlas:
  teto-diario-por-parceria: ${ATLAS_TETO_DIARIO:200}
  # [ATLAS] O raciocínio do modelo (o "thinking" do DeepSeek, {"type":"enabled"} ou "disabled"). Ligado, o reasoning_content de cada
  # resposta é gravado e volta ao modelo em todas as idas seguintes (com ferramentas, o DeepSeek responde 400 sem ele), mas NUNCA
  # sai do servidor: a conversa recebe só um resumo curto dele, gerado numa chamada à parte (o item "raciocinio" com "resumo", e os
  # eventos "pensando" e "resumo" do fluxo). Desligado, não há raciocínio, nem "pensando", nem resumo. Vale para o modelo das
  # variáveis de ambiente e para o da chave do debug.
  raciocinio: ${ATLAS_RACIOCINIO:true}
  # [ATLAS] Quanto o turno espera, antes do "fim" (ou da resposta JSON), pelos resumos do raciocínio ainda pendentes. O que não
  # ficou pronto sai sem resumo; se ficar pronto depois, ainda é gravado e aparece na próxima leitura da conversa.
  prazo-do-resumo: ${ATLAS_PRAZO_DO_RESUMO:PT15S}
  debug:
    # [ATLAS] TEMPORÁRIO: as rotas /api/debug/llm (pôr a chave do modelo pela tela, só na memória da API). Desligado por padrão;
    # ligado só no perfil dev, abaixo. Sem esta propriedade, as rotas não existem (404).
    chaves: false
    # [ATLAS] TEMPORÁRIO: a conversa mostra cada ferramenta que o agente chamou (nome, argumentos e resultado crus; item "ferramenta" e
    # evento "ferramenta" do fluxo). Desligado por padrão; ligado no perfil dev, abaixo. O raciocínio cru nunca sai, nem por aqui.
    ferramentas: ${ATLAS_DEBUG_FERRAMENTAS:false}
  # [ATLAS] O relatório de trabalho (cartão de perguntas, relatório pronto, rotas 46 a 48, ferramentas relatorio_*). Desligado por
  # padrão, no dev também: o Atlas é só o chat, com parceria_consultar. O código e as tabelas ficam, para o relatório voltar.
  relatorio:
    ligado: ${ATLAS_RELATORIO:false}
  # [ATLAS] O diagnóstico (M2 do plano do Atlas completo): cada turno deixa um traço em atlas_traco (V10) e as rotas 49 a 53 existem.
  # Desligado por padrão e na suíte (ligado por classe de teste); ligado no perfil dev, abaixo. Desligado, nada é gravado e as rotas
  # respondem 404. O traço nunca leva o raciocínio cru, chave nem o prompt de sistema.
  diagnostico:
    ligado: ${ATLAS_DIAGNOSTICO:false}
    # A marca vê o diagnóstico das próprias conversas (rota 49, o campo diagnosticoDisponivel e o turno dos itens). Só vale com o
    # diagnóstico ligado. A RBS vê o de todas as conversas (rotas 50 a 53) quando o diagnóstico está ligado.
    marca: ${ATLAS_DIAGNOSTICO_MARCA:false}
    # O custo do turno, em dólares. O OpenCode Go é uma assinatura com limite de uso (US$ 80 por mês), não cobra por token, e o preço do
    # DeepSeek V4.1 Flash no Go não consta em docs/atlas/referencias/. Por isso o custo vem de usage.opencode.list_cost, que o Go devolve
    # em cada resposta (somado pelo diagnóstico e gravado em dados.custoUsd da etapa LLM_IDA, com custoOrigem RESPOSTA). Estes dois preços
    # (US$ por milhão de tokens) só valem quando uma resposta NÃO traz o list_cost, com custoOrigem PRECO_CONFIGURADO. Os valores vêm do
    # quadro do Atlas (docs/atlas/referencias/quadro-fluxo-ia-atlas.txt, tabela "Provedores"): preço de lista do mesmo modelo no OpenCode
    # Zen, 0,30 de entrada e 1,20 de saída por milhão (o preço de cache, 0,006, não entra: a API não separa os tokens em cache).
    # 0 nos dois = sem estimativa (o custo fica de fora).
    preco-por-milhao:
      entrada: ${ATLAS_PRECO_ENTRADA:0.30}
      saida: ${ATLAS_PRECO_SAIDA:1.20}
  # [ATLAS] O JEV (TypeSafe) e os embeddings (Gemini). Por enquanto só o diagnóstico os usa (rotas 52 e 53 mostram o estado e testam a
  # conexão); os clientes de verdade entram no M7 (JEV) e no M3 (Gemini). As chaves vêm de variável de ambiente ou, no perfil dev, de
  # config/segredos.local.properties; nunca deste arquivo. As URLs base são configuráveis para os testes usarem um servidor falso.
  jev:
    modo: ${ATLAS_JEV:none}                       # none | sombra | ativo
    modelo: ${ATLAS_JEV_MODELO:jev-1.14.0}
    base-url: ${ATLAS_JEV_BASE_URL:https://api.typesafe.ai}
    chave: ${TYPESAFE_API_KEY:}
  embeddings:
    provedor: ${ATLAS_EMBEDDINGS:none}            # gemini | teste | none
    modelo: gemini-embedding-2
    base-url: ${ATLAS_GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
    chave: ${GEMINI_API_KEY:}
    # Quanto esperar antes de tentar de novo depois de um 429 do Gemini (cresce a cada tentativa; o Retry-After, se vier, vale).
    espera-no-429: PT5S
  # [ATLAS] A ingestão dos documentos (M3): extrair, dividir, embeddings e gravar os trechos, numa fila na memória (2 threads, atlas-ingestao-).
  # Aprovar um documento (rota 57) o põe em PROCESSANDO e enfileira DEPOIS do commit. sincrona=true só nos testes: o callback do commit manda
  # a tarefa ao executor e espera o resultado, para o teste ler o documento já indexado (nunca roda na thread do callback).
  ingestao:
    sincrona: false

server:
  port: 8080
  servlet:
    session:
      # Sessão de 8 horas sem uso. O cookie JSESSIONID não é lido por JavaScript (HttpOnly).
      timeout: 8h
      cookie:
        http-only: true
        same-site: lax
        # [PENDENTE] Em produção, atrás do HTTPS: server.servlet.session.cookie.secure=true

# [UPLOAD] Pasta dos arquivos enviados (usada a partir da etapa 5). Fica fora do banco; no banco vai só o caminho.
# Os arquivos ficam com nome gerado pelo servidor (UUID), fora de qualquer pasta pública, e só saem pelo download da API.
portal:
  armazenamento:
    pasta: ./armazenamento
    # Limite exato de um arquivo, conferido pelo Armazenamento (20 MB). A resposta ao passar disso é 413.
    tamanho-maximo-bytes: 20971520

---
spring:
  config:
    activate:
      on-profile: dev
    # [ATLAS] As chaves dos provedores, se existir o arquivo (fora do Git). O caminho é relativo à pasta em que a API sobe: backend/.
    import: optional:file:./config/segredos.local.properties
  flyway:
    # [ITEM-1] A amostra (Amarelo, Roxo e Verde) mora em db/dev e só carrega neste perfil e no de teste.
    locations: classpath:db/migration,classpath:db/dev

# [ATLAS] As rotas de debug da chave do modelo de linguagem (temporárias) só existem no desenvolvimento, e só a RBS as usa.
# O diagnóstico fica ligado no dev, também para a marca ver o das próprias conversas.
atlas:
  debug:
    chaves: true
    ferramentas: ${ATLAS_DEBUG_FERRAMENTAS:true}
  diagnostico:
    ligado: ${ATLAS_DIAGNOSTICO:true}
    marca: ${ATLAS_DIAGNOSTICO_MARCA:true}

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    # Banco separado do de desenvolvimento, porque os testes o apagam por inteiro.
    # Variável própria (PORTAL_BD_TESTE_URL) para ninguém apagar o banco "portal" por engano.
    url: ${PORTAL_BD_TESTE_URL:jdbc:postgresql://localhost:5432/portal_teste}
    hikari:
      # Cada contexto de teste (um por conjunto de propriedades) fica em cache com o seu pool: sem isto, cada um segura 10 conexões
      # abertas e a suíte esgota o PostgreSQL. Uma conexão de reserva basta; as que sobram fecham depois de 10 s parados.
      minimum-idle: 1
      idle-timeout: 10000
  flyway:
    locations: classpath:db/migration,classpath:db/dev
    # O clean só roda pela estratégia de migração que existe nos testes (src/test/java), nunca no código de produção.
    clean-disabled: false
  ai:
    model:
      # [ATLAS] A suíte sobe sem chave e nunca chama o provedor: o loop usa o roteiro de teste.
      chat: none

# [ATLAS] As rotas de debug ficam desligadas no contexto de teste normal; a classe de teste delas as liga.
# [ATLAS] No teste o relatório fica ligado (os testes dele continuam valendo) e o debug das ferramentas, desligado; as classes de
# teste do modo só chat e do debug mudam isso com @TestPropertySource.
atlas:
  debug:
    chaves: false
    ferramentas: false
  relatorio:
    ligado: true
  # O diagnóstico fica desligado no contexto de teste normal (nada é gravado em atlas_traco); a classe de teste que o confere o liga.
  diagnostico:
    ligado: false
    marca: false
  # Os embeddings da suíte são os de teste (determinísticos, sem rede) e a ingestão espera o fim: o kit de documentos sobe e indexa a cada
  # contexto, e nenhum teste comum chama o Gemini. Os testes @Tag("avaliacao") trocam isto pelo perfil avaliacao.
  embeddings:
    provedor: teste
  ingestao:
    sincrona: true

# [UPLOAD] Nos testes, os arquivos vão para dentro de target/ (apagado pelo "mvn clean"), nunca para a pasta de desenvolvimento.
portal:
  armazenamento:
    pasta: ./target/armazenamento-teste
