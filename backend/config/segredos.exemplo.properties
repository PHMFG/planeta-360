# Modelo das chaves do Atlas. Copie para segredos.local.properties, nesta pasta, e preencha lá.
# O arquivo .local fica fora do Git e a API o lê só nos perfis dev e demo, subindo a partir de backend/.
# Sem ele, o portal sobe normalmente, com o Atlas desligado. Variável de ambiente vence o arquivo.

# Modelo de linguagem: OpenCode Go (openai = serviço compatível com a API da OpenAI; none = desligado)
ATLAS_LLM=openai
OPENCODE_API_KEY=

# Embeddings da busca nos documentos: Gemini (gemini, teste ou none)
ATLAS_EMBEDDINGS=gemini
GEMINI_API_KEY=

# JEV: TypeSafe. Nos perfis dev e demo cada ponto já vem fixado (ATLAS_JEV_<PONTO> troca um deles: ativo, sombra ou none).
# Sem perfil, ATLAS_JEV dá o modo de todos os pontos (sombra só observa; none desliga).
ATLAS_JEV=sombra
TYPESAFE_API_KEY=
